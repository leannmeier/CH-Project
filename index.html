<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <title>iPRO - Los mejores precios</title>
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="navbar-brand">
                <h1>iPRO</h1>
                <h4>Precios tan buenos que parecen un bug</h4>
            </div>
            <div class="navbar-actions">
                <button class="cart-btn" id="cartBtn">
                    🛒 <span id="cartCount">0</span>
                </button>
            </div>
        </nav>
    </header>
    <main>
        <div class="modal-overlay hidden" id="cartModal">
            <div class="modal modal-cart">
                <button class="modal-close" id="closeCart">✕</button>
                <h2>Tu carrito</h2>
                <div id="cartItems"></div>
                <div class="cart-total" id="cartTotal"></div>
                <button class="btn-primary" id="checkoutBtn">Finalizar compra</button>
            </div>
        </div>
        <div id="discountBanner" class="discount-banner hidden">
            🎉 ¡HOY ES DÍA DE DESCUENTO! Precios especiales en todos los productos
        </div>
        <div class="welcome-msg hidden" id="welcomeMsg"></div>
        <section class="products" id="productsSection">

        </section>
    </main>
    <footer>
        <div class="footer-content">
            <p>&copy; 2026 iPRO - Ningún derecho reservado</p>
            <p class="footer-author">Desarrollado por Meier Leandro Agustín</p>
        </div>
    </footer>
    <script defer src="./scripts/main.js"></script>
</body>

</html>
